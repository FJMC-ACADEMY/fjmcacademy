<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard | FJMC Academy</title>

    <link rel="stylesheet" href="student.css">
</head>

<body>

<header class="dashboard-header">
    <div class="logo">FJMC Academy</div>
    <button id="logoutBtn">Logout</button>
</header>

<main class="dashboard">

    <div class="welcome">
        <h1 id="studentName">Welcome</h1>
        <p>Your Learning Dashboard</p>
    </div>

    <h2>My Courses</h2>

    <div id="coursesContainer" class="courses-container">
        <p class="loading-text">Loading Courses...</p>
    </div>

</main>


<!-- PDF VIEWER WILL BE CREATED BY JAVASCRIPT -->


<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</html>
