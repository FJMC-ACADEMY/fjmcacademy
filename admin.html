<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FJMC Academy | Admin Panel</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<header class="admin-header">

    <div>
        <h1>FJMC Academy</h1>
        <span>Admin Panel</span>
    </div>

    <button id="logoutBtn">
        Logout
    </button>

</header>


<main class="admin-container">

    <!-- ========================================= -->
    <!-- STUDENTS -->
    <!-- ========================================= -->

    <section class="admin-card">

        <h2>Student Management</h2>

        <div class="form-grid">

            <input
                type="text"
                id="studentUid"
                placeholder="Firebase User UID"
            >

            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
            >

            <input
                type="email"
                id="studentEmail"
                placeholder="Student Email"
            >

        </div>


        <h3>Assign Courses</h3>

        <div
            id="studentCourses"
            class="checkbox-list"
        ></div>


        <div class="button-row">

            <button
                id="saveStudentBtn"
                class="primary-btn"
            >
                Save Student
            </button>

            <button
                id="clearStudentBtn"
                class="secondary-btn"
            >
                Clear
            </button>

        </div>

    </section>


    <!-- ========================================= -->
    <!-- STUDENT LIST -->
    <!-- ========================================= -->

    <section class="admin-card">

        <h2>Students</h2>

        <div
            id="studentsList"
            class="data-list"
        ></div>

    </section>


    <!-- ========================================= -->
    <!-- COURSE -->
    <!-- ========================================= -->

    <section class="admin-card">

        <h2>Course Management</h2>

        <div class="form-grid">

            <input
                type="text"
                id="courseId"
                placeholder="Course ID e.g. real-analysis"
            >

            <input
                type="text"
                id="courseTitle"
                placeholder="Course Title"
            >

            <input
                type="text"
                id="courseDescription"
                placeholder="Course Description"
            >

        </div>


        <button
            id="saveCourseBtn"
            class="primary-btn"
        >
            Save Course
        </button>

        <button
            id="clearCourseBtn"
            class="secondary-btn"
        >
            Clear
        </button>

    </section>


    <!-- ========================================= -->
    <!-- COURSES -->
    <!-- ========================================= -->

    <section class="admin-card">

        <h2>Courses</h2>

        <div
            id="coursesList"
            class="data-list"
        ></div>

    </section>


    <!-- ========================================= -->
    <!-- COURSE CONTENT -->
    <!-- ========================================= -->

    <section class="admin-card">

        <h2>Course Content</h2>

        <p id="selectedCourseText">
            Select a course first.
        </p>


        <div class="form-grid">

            <select id="contentType">

                <option value="youtube">
                    YouTube Video
                </option>

                <option value="local-video">
                    Local Video
                </option>

                <option value="pdf">
                    PDF
                </option>

                <option value="live">
                    Live Class
                </option>

            </select>


            <input
                type="text"
                id="contentTitle"
                placeholder="Lecture / Content Title"
            >


            <input
                type="text"
                id="contentUrl"
                placeholder="URL / File Path"
            >

        </div>


        <div class="button-row">

            <button
                id="addContentBtn"
                class="primary-btn"
            >
                Add Content
            </button>

            <button
                id="clearContentBtn"
                class="secondary-btn"
            >
                Clear
            </button>

        </div>


        <div
            id="contentList"
            class="content-list"
        ></div>

    </section>

</main>


<script
    type="module"
    src="admin.js?v=1"
></script>

</body>
</html>
